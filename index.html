<!DOCTYPE html>
<html>
<head>
    <title>Me Amoreeeeeee</title>

    <style>
         body {
          background-color:#ffdde1;
        text-align: center;
      font-family: arial, sans-serif;
                  }
                
          h1 {
            color: #d63384;
            font-size: 40px;
          }

        p {
          font-size: 20px;
          color:#333;
        }

        button {
          background-color: #ff4d6d;
          color: white;
          border: none;
          padding: 15px 25px;
          font-size: 18px;
          cursor: pointer;
          transition: 0.3s;
        }

        button:hover {
          background-color: #c9184a;
          transform: scale(1.1);
        }

        .foto {
          width: 250px;
          border-radius: 20px;
          margin: 20px 0;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .pedido {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background-color: rgba(0, 0, 0, 0.8);
           color: white;
           font-size: 40px;
           display: flex;
           justify-content: center;
           align-items: center;
           opacity: 0;
           visibility: hidden;
           transition: 0.5s;
           text-align: center;
        }
        
        .pedido.ativo {
           opacity: 1;
           visibility: visible;
        }

        .pedido button {
           margin: 10px;
        }

    </style>
    </head>
    <body>

<h1>Oioioi Meu amor</h1>
<p>Queria te dizer uma coisaaaa</p>

<img src="amor.jpg" alt="Nossa foto" class="foto">

<button onclick="mostrarMensagem()">Clique aqui</button>

<div id="pedido" class="pedido">
  <div>
    <p>💖 Quer namorar comigo? 💖</p>
    <button onclick="aceitou()">SIM 💍</button>
    <button id="nao" onmouseover="fugir()">NÄO 😡</button>
  </div>
</div>

<script>
      function mostrarMensagem() {
        document.getElementById("pedido").classList.add("ativo");
      }

      function aceitou() {
        alert("EU SABIAAAA 😍💖");
      }

      function fugir() {
        const botao = document.getElementById("nao");
        const largura = window.innerWidth - 100;
        const altura = window.innerHeight - 50;

        const x = Math.random() * largura;
        const y = Math.random() * altura;

        botao.style.position = "absolute";
        botao.style.left = x + "px";
        botao.style.top = y + "px";
      }

      function criarcoracao() {
        const coracao = document.createElement("div");
        coracao.innerHTML = "❤️";
        coracao.style.position = "fixed";
        coracao.style.left = Math.random() * 100 + "vw";
        coracao.style.top = "0px";
        coracao.style.fontSize = Math.random() * 20 + 20 + "px";
        coracao.style.animation = "cair 4s linear forwards";
        document.body.appendChild(coracao);

        setTimeout(() => {
          coracao.remove();
      }, 4000);
    }

    setInterval(criarcoracao, 300);
      </script>

<style>
@keyframes cair {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(100vh);
  }
}
</style>

</body>
</html>
