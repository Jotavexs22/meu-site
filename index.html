<!DOCTYPE html>
<html>
<head>
    <title>Me Amoreeeeeee</title>

    <style>
         body {
          background-color:#ffdde1;
        text-align: center;
      font-family: arial, sans-serif;
                  }
                
          h1 {
            color: #d63384;
            font-size: 40px;
          }

        p {
          font-size: 20px;
          color:#333;
        }

        button {
          background-color: #ff4d6d;
          color: white;
          border: none;
          padding: 15px 25px;
          font-size: 18px;
          cursor: pointer;
          transition: 0.3s;
        }

        button:hover {
          background-color: #c9184a;
          transform: scale(1.1);
        }
        

    </style>
    </head>
    <body>

<h1>Oioioi Meu amor</h1>
<p>Queria te dizer uma coisaaaa</p>

<button onclick="mostrarMensagem()">Clique aqui</button>

<script>
      function mostrarMensagem() {
        alert("Eu Te Amo Muito! ❤️");
      }

      function criarcoracao() {
        const coracao = document.createElement("div");
        coracao.innerHTML = "❤️";
        coracao.style.position = "fixed";
        coracao.style.left = Math.random() * 100 + "vw";
        coracao.style.top = "0px";
        coracao.style.fontSize = Math.random() * 20 + 20 + "px";
        coracao.style.animation = "cair 4s linear";
        document.body.appendChild(coracao);

        setTimeout(() => {
          coracao.remove();
      }, 4000);
    }

    setInterval(criarcoracao, 300);
      </script>

<style>
@keyframes cair {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(100vh);
  }
}
</style>

</body>
</html>
